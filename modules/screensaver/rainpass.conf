# The rain pass window (omk-rainpass): full screen, opaque, no focus. For hyprland.conf
# (classic windowrulev2 syntax; untested, check the Hyprland wiki if a line is rejected).
windowrulev2 = float, class:^(org\.omk\.rainpass)$
windowrulev2 = pin, class:^(org\.omk\.rainpass)$
windowrulev2 = fullscreen, class:^(org\.omk\.rainpass)$
windowrulev2 = nofocus, class:^(org\.omk\.rainpass)$
windowrulev2 = noinitialfocus, class:^(org\.omk\.rainpass)$
windowrulev2 = noborder, class:^(org\.omk\.rainpass)$
windowrulev2 = noshadow, class:^(org\.omk\.rainpass)$
windowrulev2 = noblur, class:^(org\.omk\.rainpass)$
windowrulev2 = noanim, class:^(org\.omk\.rainpass)$
windowrulev2 = opacity 1.0 override 1.0 override, class:^(org\.omk\.rainpass)$

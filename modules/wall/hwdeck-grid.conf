# hwdeck views float in a 3 x 2 grid: cpu | thermal | network over memory | power | battery.
# For hyprland.conf (classic syntax, windowrulev2). Percentages of the monitor; adjust the 4%
# top offset to your bar's height. Untested: Hyprland's rule syntax has changed across releases,
# check https://wiki.hypr.land/Configuring/Window-Rules/ if a line is rejected.
windowrulev2 = float, class:^(org\.omk\.hwdeck-.*)$
windowrulev2 = size 32.6% 46.5%, class:^(org\.omk\.hwdeck-.*)$
windowrulev2 = move 0.5% 4%, class:^(org\.omk\.hwdeck-cpu)$
windowrulev2 = move 33.7% 4%, class:^(org\.omk\.hwdeck-thermal)$
windowrulev2 = move 66.9% 4%, class:^(org\.omk\.hwdeck-network)$
windowrulev2 = move 0.5% 51.5%, class:^(org\.omk\.hwdeck-memory)$
windowrulev2 = move 33.7% 51.5%, class:^(org\.omk\.hwdeck-power)$
windowrulev2 = move 66.9% 51.5%, class:^(org\.omk\.hwdeck-battery)$

# omarchy-mac-kit touchbar: t1bridge's Touch Bar service gets Omarchy's desktop provider
# (volume, mute, media, Omarchy's OSD) from t1bridge's contrib/omarchy script. Display power stays
# with the renderer (touchbar-strip blanks itself while the panel is off).
[Service]
Environment=T1BRIDGE_DESKTOP_PROVIDER=%h/.local/bin/t1bridge-omarchy-provider
Environment=T1BRIDGE_OMARCHY_DISPLAY_POWER=0
